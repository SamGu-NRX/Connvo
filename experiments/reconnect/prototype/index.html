<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Connvo reconnect-study prototype</title>
    <style>
      body { font-family: ui-monospace, monospace; margin: 2rem; background: #111; color: #ddd; }
      h1 { font-size: 1rem; } h2 { font-size: .9rem; color: #9cf; margin-bottom: .3rem; }
      .panel { border: 1px solid #444; padding: .75rem; margin-bottom: 1rem; max-width: 640px; }
      .row { margin: .15rem 0; } .row b { color: #ffd479; }
      textarea { width: 100%; min-height: 90px; font-family: inherit; background: #1b1b1b; color: #eee; }
      button { margin-right: .5rem; padding: .35rem .7rem; }
      .warn { color: #ff8f8f; } .ok { color: #8fd694; }
      /* Keyboard operability: always-visible focus for keyboard users. */
      :focus { outline: 2px dashed #6ea8ff; outline-offset: 2px; }
      :focus-visible { outline: 3px solid #6ea8ff; outline-offset: 2px; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid #6ea8ff; outline-offset: 2px; }
      .kbd-legend { color: #8ab4f8; font-size: .8rem; margin-top: .5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
