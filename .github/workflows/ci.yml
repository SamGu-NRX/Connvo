name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, alpha]
  pull_request:
    branches: [main, alpha]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm run type-check

      - name: Run linting
        run: pnpm run lint

      - name: Run tests
        run: pnpm test:run

      - name: Start anonymous local backend for the build
        run: |
          pnpm call-eval:backend -- --no-next --port=3103
          node -e 'const fs = require("node:fs"); const state = JSON.parse(fs.readFileSync("tools/call-eval/out/state.json", "utf8")); fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_CONVEX_URL=${state.convexUrl}\n`);'

      - name: Test build
        run: pnpm run build

      - name: Stop anonymous local backend
        if: always()
        run: pnpm call-eval:backend -- --stop --port=3103

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to staging
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID_STAGING }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY_STAGING }}
        run: |
          pnpm exec convex codegen
          pnpm exec convex deploy --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID_PROD }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY_PROD }}
        run: |
          pnpm exec convex codegen
          pnpm exec convex deploy --prod --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
